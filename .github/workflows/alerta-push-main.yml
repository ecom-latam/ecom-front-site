name: Alerta de push directo a main

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que el commit venga de un PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for intento in 1 2 3 4 5 6; do
            PRS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length')
            [ "$PRS" != "0" ] && exit 0
            sleep 10
          done
          echo "::error::El commit ${{ github.sha }} llegó a main sin pasar por un PR (autor: ${{ github.actor }})"
          exit 1
